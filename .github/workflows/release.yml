name: "Mise à jour desktop — build, signature et publication"

# Déclencheur : un tag manuel v* (créé via scripts/release.mjs).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Secrets requis (à définir dans Settings > Secrets > Actions du repo privé) :
#   TAURI_SIGNING_PRIVATE_KEY          — contenu de ~/.tauri/bulletins-scolaires.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — contenu de ~/.tauri/bulletins-scolaires.key.pass
#   RELEASES_PAT                       — token GitHub fine-grained (accès contenu
#                                        read/write sur Nouhoudiallo/bulletins-scolaires-updates)

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bs/frontend/src-tauri

      - name: Dépendances Bun
        working-directory: bs/frontend
        run: bun install --frozen-lockfile

      - name: Construire et signer l'app
        working-directory: bs/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build

      - name: Rassembler les artefacts (à plat)
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts-out
          rm -rf "$OUT" && mkdir -p "$OUT"
          B=bs/frontend/src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$B"/nsis/*.exe "$B"/nsis/*.exe.sig; do cp "$f" "$OUT/"; done
          ls -lh "$OUT"
          compgen -G "$OUT/*.exe.sig" >/dev/null || {
            echo "Signature Windows absente : vérifier TAURI_SIGNING_PRIVATE_KEY"; exit 1;
          }

      - uses: actions/upload-artifact@v4
        with:
          name: update-windows-x86_64
          if-no-files-found: error
          path: artifacts-out/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L'AppImage embarque webkit2gtk : la glibc de la machine de build devient
      # une exigence pour l'utilisateur. Les labels de runners GitHub ne sont pas
      # fiables (ubuntu-22.04 a été remappé sur un hôte 26.04/glibc 2.43), donc on
      # épingle explicitement l'image : Ubuntu 22.04 = glibc 2.35.
      - name: Construire l'AppImage dans Ubuntu 22.04
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Heredoc : le script contient lui-même des quotes, on le passe sur
          # stdin (`bash -s`) pour éviter tout conflit d'échappement.
          docker run --rm -i \
            -v "$PWD":/project \
            -w /project/bs/frontend \
            -e TAURI_SIGNING_PRIVATE_KEY \
            -e TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            ubuntu:22.04 bash -s <<'CONTAINER'
          set -euo pipefail
          . /etc/os-release
          echo "Base de build : Ubuntu $VERSION_ID"
          [ "$VERSION_ID" = "22.04" ] || { echo "Image inattendue : $VERSION_ID"; exit 1; }

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential curl wget file git unzip pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf ca-certificates binutils

          curl -fsSL https://bun.sh/install | bash
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"

          bun install --frozen-lockfile
          bunx tauri build

          # Garde-fou : l'AppImage ne doit exiger aucune glibc plus récente que
          # celle d'Ubuntu 22.04 (2.35), sinon elle refuse de démarrer ailleurs.
          cd src-tauri/target/release/bundle/appimage
          APP=$(ls *.AppImage | head -1)
          "./$APP" --appimage-extract >/dev/null
          MAX=$(find squashfs-root -type f \( -name "*.so*" -o -perm -u+x \) -print0 \
            | xargs -0 -P 8 -I{} sh -c 'if file -b "{}" | grep -q ELF; then objdump -T "{}" 2>/dev/null || true; fi' \
            | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1) || true
          echo "Exigence glibc maximale : ${MAX:-aucune}"
          if [ "$(printf '%s\n%s\n' "${MAX:-GLIBC_2.2.5}" "GLIBC_2.35" | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "ERREUR : l'AppImage exige ${MAX} > GLIBC_2.35 (incompatible)."
            exit 1
          fi
          CONTAINER

      - name: Rassembler les artefacts (à plat)
        run: |
          set -euo pipefail
          OUT=artifacts-out
          rm -rf "$OUT" && mkdir -p "$OUT"
          B=bs/frontend/src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$B"/appimage/*.AppImage "$B"/appimage/*.AppImage.sig \
                   "$B"/appimage/*.AppImage.tar.gz "$B"/appimage/*.AppImage.tar.gz.sig; do
            cp "$f" "$OUT/"
          done
          ls -lh "$OUT"
          compgen -G "$OUT/*.AppImage" >/dev/null || { echo "AppImage absente"; exit 1; }
          compgen -G "$OUT/*.sig" >/dev/null || {
            echo "Signature Linux absente : vérifier TAURI_SIGNING_PRIVATE_KEY"; exit 1;
          }

      - uses: actions/upload-artifact@v4
        with:
          name: update-linux-x86_64
          if-no-files-found: error
          path: artifacts-out/*

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les notes de release proviennent de l'annotation du tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts-update
          pattern: update-*
          merge-multiple: true

      - name: Assembler latest.json + artefacts normalisés
        run: |
          TAG="${GITHUB_REF_NAME}"
          node scripts/build-latest-json.mjs \
            --tag "$TAG" \
            --repo Nouhoudiallo/bulletins-scolaires-updates \
            --dist dist-update \
            --artifacts-dir artifacts-update
          ls -lh dist-update

      - name: Publier la release sur le repo public
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents:subject)' "$TAG")"
          if gh release view "$TAG" --repo Nouhoudiallo/bulletins-scolaires-updates >/dev/null 2>&1; then
            gh release upload "$TAG" dist-update/* --repo Nouhoudiallo/bulletins-scolaires-updates --clobber
          else
            gh release create "$TAG" dist-update/* \
              --repo Nouhoudiallo/bulletins-scolaires-updates \
              --title "Bulletins Scolaires ${TAG#v}" \
              --notes "${NOTES:-${TAG#v} — mise à jour automatique}"
          fi
          echo "Endpoint de l'updater : https://github.com/Nouhoudiallo/bulletins-scolaires-updates/releases/latest/download/latest.json"
