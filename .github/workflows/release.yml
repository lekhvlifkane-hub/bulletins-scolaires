name: "Mise à jour desktop — build, signature et publication"

# Déclencheur : un tag manuel v* (créé via scripts/release.mjs).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Secrets requis (à définir dans Settings > Secrets > Actions du repo privé) :
#   TAURI_SIGNING_PRIVATE_KEY          — contenu de ~/.tauri/bulletins-scolaires.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — contenu de ~/.tauri/bulletins-scolaires.key.pass
#   RELEASES_PAT                       — token GitHub fine-grained (accès contenu
#                                        read/write sur Nouhoudiallo/bulletins-scolaires-updates)

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            # Ubuntu 22.04 (glibc 2.35) et non ubuntu-latest : comme l'AppImage
            # embarque webkit2gtk, la version de glibc du runner devient une
            # exigence pour la machine de l'utilisateur. Construire sur une base
            # plus ancienne garde la compatibilité ascendante (Pop!_OS 24.04 =
            # glibc 2.39 refusait un build fait sur ubuntu-latest/glibc 2.43).
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bs/frontend/src-tauri

      - name: Dépendances système Linux (webview)
        if: matrix.platform == 'linux-x86_64'
        run: |
          . /etc/os-release
          echo "Base de compilation : Ubuntu $VERSION_ID (glibc $(ldd --version | head -1 | awk '{print $NF}'))"
          # L'AppImage embarque webkit2gtk : la glibc du runner devient une
          # exigence pour l'utilisateur. On refuse de publier depuis une base
          # plus récente que 22.04 (compatibilité ascendante).
          if [ "$VERSION_ID" != "22.04" ]; then
            echo "::error::Runner $VERSION_ID inattendu : l'AppImage exigerait une glibc trop récente."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Dépendances Bun
        working-directory: bs/frontend
        run: bun install --frozen-lockfile

      - name: Construire et signer l'app
        working-directory: bs/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bunx tauri build

      - name: Artefacts Windows
        if: matrix.platform == 'windows-x86_64'
        run: ls target/release/bundle/nsis
        working-directory: bs/frontend/src-tauri

      - name: Artefacts Linux
        if: matrix.platform == 'linux-x86_64'
        run: ls target/release/bundle/appimage
        working-directory: bs/frontend/src-tauri

      # Copie à plat : upload-artifact v4 recrée l'arborescence d'origine dès que
      # les motifs viennent de plusieurs dossiers, ce qui cassait le job publish.
      - name: Rassembler les artefacts (à plat)
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts-out
          rm -rf "$OUT" && mkdir -p "$OUT"
          B=bs/frontend/src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$B"/nsis/*.exe "$B"/nsis/*.exe.sig \
                   "$B"/appimage/*.AppImage "$B"/appimage/*.AppImage.sig \
                   "$B"/appimage/*.AppImage.tar.gz "$B"/appimage/*.AppImage.tar.gz.sig; do
            cp "$f" "$OUT/"
          done
          ls -lh "$OUT"
          # Signature indispensable pour publier une mise à jour vérifiable.
          compgen -G "$OUT/*.sig" >/dev/null || { echo "Signatures absentes : vérifier TAURI_SIGNING_PRIVATE_KEY"; exit 1; }

      - name: Sauvegarder les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.platform }}
          if-no-files-found: error
          path: artifacts-out/*

  publish:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les notes de release proviennent de l'annotation du tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          path: artifacts-update
          pattern: update-*
          merge-multiple: true

      - name: Assembler latest.json + artefacts normalisés
        run: |
          TAG="${GITHUB_REF_NAME}"
          node scripts/build-latest-json.mjs \
            --tag "$TAG" \
            --repo Nouhoudiallo/bulletins-scolaires-updates \
            --dist dist-update \
            --artifacts-dir artifacts-update
          ls -lh dist-update

      - name: Publier la release sur le repo public
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents:subject)' "$TAG")"
          if gh release view "$TAG" --repo Nouhoudiallo/bulletins-scolaires-updates >/dev/null 2>&1; then
            gh release upload "$TAG" dist-update/* --repo Nouhoudiallo/bulletins-scolaires-updates --clobber
          else
            gh release create "$TAG" dist-update/* \
              --repo Nouhoudiallo/bulletins-scolaires-updates \
              --title "Bulletins Scolaires ${TAG#v}" \
              --notes "${NOTES:-${TAG#v} — mise à jour automatique}"
          fi
          echo "Endpoint de l'updater : https://github.com/Nouhoudiallo/bulletins-scolaires-updates/releases/latest/download/latest.json"
