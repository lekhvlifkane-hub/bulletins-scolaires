[package]
name = "bulletins-scolaires"
version = "0.1.7"
description = "Bulletins Scolaires — la gestion scolaire, plus simple"
authors = ["Bulletins Scolaires"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
